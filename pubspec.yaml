name: pos_app
description: "Sistem Point of Sale (POS) offline-first berbasis Flutter + SQLite (Drift) + Supabase."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Offline database
  drift: ^2.20.2
  drift_flutter: ^0.2.0

  # Remote database / auth
  supabase: ^2.5.0
  supabase_flutter: ^2.8.0

  # Charts
  fl_chart: ^0.68.0

  # Connectivity
  connectivity_plus: ^6.0.5

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.2
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0
  collection: ^1.18.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.example
